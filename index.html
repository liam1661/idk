<!DOCTYPE html>
<html lang="da">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusikBasen</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<header>

    <div class="logo">

        <h1>MB</h1>

    </div>


    <nav>

        <a href="index.html">Forside</a>

        <a href="pages/artists.html">Kunstnere</a>

        <a href="pages/albums.html">Albums</a>

        <a href="pages/songs.html">Sange</a>

        <a href="pages/playlists.html">Playlister</a>
        <a href="pages/rankings.html">Rankings</a>

    </nav>


    <div class="header-icons">

        <button id="search-button">🔍</button>

        <button>❤️</button>

        <button>👤</button>

    </div>

</header>


<div id="search-overlay" class="search-overlay">

    <div class="search-box">

        <input
            type="text"
            id="search-input"
            placeholder="Søg efter kunstner, sang eller album..."
            autocomplete="off"
        >

        <button id="close-search">✕</button>

    </div>


    <div id="search-results" class="search-results"></div>

</div>


<section id="hero">

    <div class="hero-content">

        <span class="hero-tag">

            Danmarks største musikdatabase

        </span>


        <h1>

            Opdag ny musik.<br>

            Genoplev klassikere.

        </h1>


        <p>

            MusikBasen samler danske og internationale kunstnere,
            albums, sange og playlister ét sted.

        </p>


        <div class="hero-buttons">

            <button class="button">

                Udforsk MusikBasen

            </button>


            <button class="button secondary">

                Se populære kunstnere

            </button>

        </div>

    </div>

</section>


<section id="trending">

    <div class="section-header">

        <h2>Trending lige nu</h2>

        <a href="#">Se alle</a>

    </div>


    <div class="trending-grid">

        
            </div>

        </div>

    </div>

</section>


<section id="artists">

</section>


<section id="albums">

</section>


<section id="today">

</section>


<section id="recommendation">

</section>


<footer>

</footer>


<script src="data/artists.js"></script>

<script src="data/albums.js"></script>

<script src="data/songs.js"></script>

<script src="data/playlists.js"></script>

<script src="script.js"></script>

<div class="music-player" id="music-player" style="display: none;">

    <div class="player-song">
        <div class="player-cover"></div>

        <div class="player-info">
            <strong id="player-title">Ingen sang valgt</strong>
            <span id="player-artist">MusikBasen</span>
        </div>
    </div>

    <div class="player-controls">

        <button id="player-prev">⏮</button>

        <button id="player-play">▶</button>

        <button id="player-next">⏭</button>

    </div>

    <div class="player-progress">

        <span id="player-current-time">0:00</span>

        <input
            type="range"
            id="player-progress-bar"
            min="0"
            max="100"
            value="0"
        >

        <span id="player-duration">0:00</span>

    </div>

    <div class="player-volume">

        🔊

        <input
            type="range"
            id="player-volume-bar"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>

</div>
</body>

</html>
