<!DOCTYPE html>
<html lang="da">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kunstnere | MusikBasen</title>

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../theme.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<header>

    <div class="logo">
        <h1>MB</h1>
    </div>


    <nav>

        <a href="../index.html">
            Forside
        </a>

        <a href="artists.html">
            Kunstnere
        </a>

        <a href="albums.html">
            Albums
        </a>

        <a href="songs.html">
            Sange
        </a>

        <a href="playlists.html">
            Playlister
        </a>

    </nav>


    <div class="header-icons">

        <button>🔍</button>
        <button>❤️</button>
        <button>👤</button>

    </div>

</header>



<main>


    <!-- ========================= -->
    <!-- KUNSTNER OVERSIGT -->
    <!-- ========================= -->

    <section id="artists-list-page">

        <section class="page-title">

            <h1>Kunstnere</h1>

            <p>
                Udforsk kunstnere på MusikBasen.
            </p>

        </section>


        <div
            class="artists-grid"
            id="artists-grid"
        ></div>

    </section>



    <!-- ========================= -->
    <!-- KUNSTNER DETALJER -->
    <!-- ========================= -->

    <section
        id="artist-detail-page"
        style="display:none;"
    >

        <section class="artist-hero">

            <div class="artist-hero-image"></div>


            <div class="artist-hero-info">

                <span>KUNSTNER</span>

                <h1 id="artist-name">
                    Kunstner
                </h1>

                <p id="artist-description">
                    Kunstnerinformation indlæses...
                </p>


                <div class="artist-meta">

                    <span id="artist-genre"></span>

                    <span id="artist-country"></span>

                </div>

            </div>

        </section>



        <section class="artists-section">

            <div class="section-header">

                <h2>Albums</h2>

            </div>


            <div
                id="artist-albums"
                class="albums-grid"
            ></div>

        </section>



        <section class="artists-section">

            <div class="section-header">

                <h2>Sange</h2>

            </div>


            <div
                id="artist-songs"
                class="trending-grid"
            ></div>

        </section>

    </section>

</main>



<script src="../script.js"></script>


</body>

</html>
